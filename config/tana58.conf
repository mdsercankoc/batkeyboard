CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# ZMK Studio Ana ve Alt Katman Yetkileri
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=y
CONFIG_ZMK_STUDIO_TRANSPORT_USB=y

# USB Ham Veri Akışı Çatısı
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_HID_DEVICE_COUNT=2

# Özel Bluetooth Kimliği
CONFIG_ZMK_KEYBOARD_NAME="BATkeyboard"
